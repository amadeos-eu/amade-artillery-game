dialog.about.text=Da due a quattro carri armati sparano a turno su un paesaggio di colline e valli. Regola l'angolo e la potenza, tieni conto del vento e spara.
dialog.about.rules=Sinistra e destra girano il cannone, su e giù regolano la potenza, Tab e Q scelgono l'arma, Spazio spara; oppure tieni premuto il mouse, punta e rilascia. Il vento cambia a ogni turno. Ogni proiettile apre un cratere, la terra scivola dietro, e un carro che cade da molto in alto subisce danni. Il proiettile pesante apre un cratere più grande, il colpo triplo spara tre proiettili, il proiettile di terra solleva un cumulo di terra; ogni carro ne ha due di ciascuno per round. L'ultimo carro rimasto vince il round, e il primo a vincere abbastanza round vince la partita. P mette in pausa, F11 passa a schermo intero e torna indietro.
