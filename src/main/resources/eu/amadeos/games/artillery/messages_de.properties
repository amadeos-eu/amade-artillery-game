dialog.about.text=Zwei bis vier Panzer schießen abwechselnd über eine Landschaft aus Hügeln und Tälern. Winkel und Kraft einstellen, auf den Wind achten und feuern.
dialog.about.rules=Links und rechts drehen das Rohr, auf und ab stellen die Kraft ein, Tab und Q wählen die Waffe, die Leertaste feuert; oder Maustaste halten, zeigen und loslassen. Der Wind ändert sich in jedem Zug. Jede Granate reißt einen Krater, die Erde rutscht nach, und ein Panzer, der tief fällt, nimmt Schaden. Die schwere Granate reißt einen größeren Krater, der Dreifachschuss feuert drei Granaten, der Erdschuss schüttet Erde auf; jeder Panzer hat zwei von jeder pro Runde. Der letzte Panzer gewinnt die Runde, und wer zuerst genug Runden gewinnt, gewinnt das Spiel. P hält an, F11 schaltet auf Vollbild und zurück.
