dialog.about.text=Two to four tanks take turns on a landscape of hills and valleys. Set the angle and the power, mind the wind, and fire.
dialog.about.rules=Left and right turn the barrel, up and down set the power, Tab and Q pick the weapon, Space fires; or hold the mouse button, point and let go. The wind changes every turn. Every shell blows a crater, the earth slides after it, and a tank that falls deep is hurt. The heavy shell blows a bigger crater, the triple shot fires three shells, the dirt shot heaps up earth; each tank has two of each per round. The last tank standing wins the round, and the first to win enough rounds wins the match. P pauses, F11 switches to full screen and back.
