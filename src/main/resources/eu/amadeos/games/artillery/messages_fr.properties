dialog.about.text=Deux à quatre chars tirent chacun leur tour sur un paysage de collines et de vallées. Réglez l'angle et la puissance, tenez compte du vent, et tirez.
dialog.about.rules=Gauche et droite tournent le canon, haut et bas règlent la puissance, Tab et Q choisissent l'arme, Espace tire ; ou maintenez le bouton de la souris, visez et relâchez. Le vent change à chaque tour. Chaque obus creuse un cratère, la terre glisse derrière, et un char qui tombe de haut est blessé. L'obus lourd creuse un plus grand cratère, le tir triple tire trois obus, l'obus de terre forme un tas de terre ; chaque char en a deux de chaque par manche. Le dernier char debout gagne la manche, et le premier à gagner assez de manches gagne la partie. P met en pause, F11 passe en plein écran et revient.
