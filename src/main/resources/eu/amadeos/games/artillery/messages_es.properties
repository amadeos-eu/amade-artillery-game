dialog.about.text=De dos a cuatro tanques disparan por turnos sobre un paisaje de colinas y valles. Ajuste el ángulo y la potencia, tenga en cuenta el viento y dispare.
dialog.about.rules=Izquierda y derecha giran el cañón, arriba y abajo ajustan la potencia, Tab y Q eligen el arma, Espacio dispara; o mantenga el botón del ratón, apunte y suelte. El viento cambia en cada turno. Cada proyectil abre un cráter, la tierra se desliza tras él, y un tanque que cae desde muy alto sufre daño. El proyectil pesado abre un cráter mayor, el disparo triple lanza tres proyectiles, el proyectil de tierra levanta un montón de tierra; cada tanque tiene dos de cada uno por ronda. El último tanque en pie gana la ronda, y el primero en ganar suficientes rondas gana la partida. P pausa, F11 cambia a pantalla completa y vuelve.
